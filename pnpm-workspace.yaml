packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 reads its own settings from here, not from .npmrc.
prefer-workspace-packages: true

# pnpm switches itself to the exact version in package.json#packageManager.
managePackageManagerVersions: true

# pnpm 10 blocks postinstall scripts by default; these two need them.
onlyBuiltDependencies:
  - electron
  - esbuild
